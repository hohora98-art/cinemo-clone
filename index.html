<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <title>Cinemo - Home</title>
    <link rel="stylesheet" href="styles/reset.css" />

  <body>
    <header class="site-header">
      <div class="container">
        <a href="./index.html">
          <img src="./images/logo.png" alt="CINEMO" />

          <ul class="service-list">

        </span>
      </div>
    </header>
    <main>
      <section class="top">
        <div class="top-image">
          <img src="assets/Image quiet-orbit.jpg" alt="고요의 궤도 대표 사진" />
          <img src="assets/main-bottom.png" alt="" />
          <img src="assets/main-left.png" alt="" />
          <!-- 배경사진 -->
        </div>
        <div class="top-content">
          <div>
            <svg>
              <!-- 작대기 -->
            </svg>
            <p>이번 주의 발견</p>
            <p>VOL. 01</p>
          </div>
          <div>
            <h1>고요의 궤도</h1>
            <p>QUIET ORBIT</p>
          </div>
          <div>
            <p>2026 ∙ SF ∙ 미스터리</p>
            <p>15+</p>
            <p>1시간 48분</p>
          </div>
          <p>
            모든 소리가 사라진 해안, 정체를 알 수 없는 신호가 도착한다. 마지막
            관측자는 그 고요 속으로 한 걸음 다가선다.
          </p>
          <div>
            <button>
              <svg></svg>
              <p>작품 살펴보기</p>
            </button>
            <button>
              <svg></svg>
              <p>찜하기</p>
            </button>

        </div>

          <p>고요가 시작되는 곳, 이야기가 깨어난다.</p>
          <p>A CINEMO ORIGINAL CONCEPT</p>
        </div>

      <div class="section-header">
        <div class="section-info">
          <h2>오늘,새로운 세계로</h2>
          <p>낯선 풍경 속에서 시작되는 네 편의 이야기</p>
        </div>
        <div class="right">
          <p>4편의 이야기</p>
        </div>
      </div>
      <div class="quiet-orbit">
        <figure>
          <img src="./assets/Image quiet-orbit.jpg" alt="" />
          <figcaption>
            <h2>고요의 궤도</h2>
            <p>SF • 미스터리 • 15+</p>
          </figcaption>
        </figure>
      </div>
      <div class="last-platform">
        <figure>
          <img src="./assets/Image last-platform.jpg" alt="" />
          <figcaption>
            <h2>마지막 승강장</h2>
            <p>드라마 • 12+</p>
          </figcaption>
        </figure>
      </div>
      <div class="blue-hour">
        <figure>
          <img src="./assets/Image blue-hour.jpg" alt="" />
          <figcaption>
            <h2>파란 시간</h2>
            <p>로맨스 • 드라마 • 12+</p>
          </figcaption>
        </figure>
      </div>
      <div class="forest-letter">
        <figure>
          <img src="./assets/Image forest-letter.jpg" alt="" />
          <figcaption>
            <h2>숲에서 온 편지</h2>
            <p>판타지 • 드라마 • 전체</p>
          </figcaption>
        </figure>
      </div>

    <footer></footer>
