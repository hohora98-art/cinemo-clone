<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinemo 프로필 선택</title>
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/style.css">
  </head>
  <body>
    <header class="header">
      <a href="#" class="logo">
        <img src="assets/Brand mark.svg" alt="" class="brand-mark">
            <span>CINEMO</span>
      </a>
    </header>

      <p class="footer-message">
        당신의 다음 장면을 만나는 곳, CINEMO
      </p>

    <main class="profile-page">
      <div class="profile-introduction">
        <p class="eyebrow">YOUR OWN SCENE</p>
          <h1>누구의 시간인가요?</h1>
        <p class="description">
        함께 보는 이야기, 취향은 각자의 방식으로.
        </p>
      </div>
      

      <section class="profile-list">
        <button class="profile-card profile-Y">
          <img
            class="profile-avatar"
            src="assets/avatar-mint.png"
            alt="욜로 프로필"
          />
          <span class="profile-name">욜로</span> 
        </button>

         <button class="profile-card profile-J">
          <img
            class="profile-avatar"
            src="assets/Avatar-yellow.png"
            alt="지호 프로필"
          />
          <span class="profile-name">지호</span>
        </button>

         <button class="profile-card profile-M">
          <img
            class="profile-avatar"
            src="assets/Avatar-pupple.png"
            alt="민 프로필"
          />
          <span class="profile-name">민</span>
        </button>

         <button class="profile-card profile-G">
          <img
            class="profile-avatar"
            src="assets/Avatar-green.png"
            alt="게스트 프로필"
          />
          <span class="profile-name">게스트</span>
        </button>
      </section> 

      <button class="manage-button">
        <img src="assets/Vector.svg" alt="" class="edit-icon" />
        프로필 관리
      </button>
    </main>
    <footer></footer>
  </body>
</html>
